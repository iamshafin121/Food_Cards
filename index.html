<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Food Cards</title>
  </head>
  <body class="bg-gray-200 italic">
    <div class="flex flex-col justify-center items-center my-10 mx-auto">
      <div class="input-container mb-15">
        <h1 class="text-red-900 text-2xl mb-5 font-bold text-center">
          Get food list based on Country
        </h1>
        <input
          class="p-4 border-1 rounded-lg mr-2"
          type="text"
          placeholder="American"
        />
        <button
          class="bg-red-900 p-4 rounded-lg text-white font-bold"
          type="submit"
        >
          Search
        </button>
      </div>
      <div class="m-10">
        <div
          id="cards"
          class="grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] w-[80vw] justify-center gap-4"
        ></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
